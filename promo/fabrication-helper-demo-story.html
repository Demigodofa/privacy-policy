<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabrication Helper Demo Story</title>
  <style>
    :root {
      color-scheme: light;
      --red: #b00822;
      --navy: #13263a;
      --ink: #182334;
      --muted: #566170;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: #dfe5eb;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
    }

    .story {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, #f7f9fb 0%, #eef2f6 58%, #dfe6ed 100%);
    }

    .brand {
      position: absolute;
      top: 58px;
      left: 58px;
      right: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-size: 32px;
      font-weight: 900;
    }

    .pill {
      padding: 15px 20px;
      border-radius: 8px;
      background: var(--navy);
      color: #ffffff;
      font-size: 27px;
      font-weight: 900;
    }

    .copy {
      position: absolute;
      top: 150px;
      left: 58px;
      right: 58px;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 20px;
      padding: 12px 18px;
      border-radius: 8px;
      background: var(--red);
      color: #ffffff;
      font-size: 35px;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      max-width: 930px;
      font-size: 90px;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .lead {
      max-width: 920px;
      margin-top: 28px;
      color: var(--muted);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.22;
    }

    .phone {
      position: absolute;
      left: 132px;
      top: 560px;
      width: 816px;
      height: 1140px;
      overflow: hidden;
      border: 11px solid #182334;
      border-radius: 44px;
      background: #f2f5f8;
      box-shadow: 0 28px 70px rgba(19, 38, 58, 0.26);
    }

    .phone img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 21%;
    }

    .result {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 82px;
      padding: 28px 32px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 42px rgba(19, 38, 58, 0.12);
    }

    .result strong {
      display: block;
      font-size: 44px;
      line-height: 1.08;
    }

    .result span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 27px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="story">
    <div class="brand">
      <span>Fabrication Helper</span>
      <span class="pill">$4.99 once - no ads</span>
    </div>

    <section class="copy">
      <p class="eyebrow">Actual app result</p>
      <h1>Space 7 marks over 7' 2&quot;.</h1>
      <p class="lead">Tap the example, get the rounded centers, and copy the marks.</p>
    </section>

    <div class="phone">
      <img src="../assets/apps/fabrication-helper-live-equal-spacing.png" alt="Fabrication Helper equal spacing result">
    </div>

    <section class="result">
      <strong>Spacing: 14 5/16&quot;</strong>
      <span>Also handles fractions, cut plans, bolt circles, pipe, and structural shapes.</span>
    </section>
  </main>
</body>
</html>
